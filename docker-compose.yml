services:
  epi-validator:
    build:
      context: .
      dockerfile: service/Dockerfile
    image: epi-validator:local
    ports:
      - "8080:8080"
    # Terminology + profile snapshots need real memory; do not undersize
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      start_period: 180s
      interval: 10s
      timeout: 3s
      retries: 6

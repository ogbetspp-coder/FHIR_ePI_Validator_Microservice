<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FHIR ePI Validator</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --ink: #1f2328; --muted: #656d76; --line: #d0d7de;
    --accent: #0969da; --code: #eff1f3;
    --pass-fg: #1a7f37; --pass-bg: #e6f4ea; --warn-fg: #9a6700; --warn-bg: #fff8e1;
    --fail-fg: #cf222e; --fail-bg: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e; --line: #30363d;
      --accent: #4493f8; --code: #0b0f14;
      --pass-bg: #12261a; --warn-bg: #2b2411; --fail-bg: #2b1416;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .chip {
    display: inline-block; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--muted);
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  label { color: var(--muted); font-size: 13px; }
  select, textarea, button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  textarea { width: 100%; height: 340px; resize: vertical; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .filebtn { cursor: pointer; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); color: var(--ink); }
  .filebtn:hover { border-color: var(--accent); }
  .samples button { font-size: 13px; }
  .verdict { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; border: 1px solid var(--line); }
  .verdict small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .PASS { color: var(--pass-fg); background: var(--pass-bg); }
  .PASS_WITH_WARNINGS { color: var(--warn-fg); background: var(--warn-bg); }
  .FAIL { color: var(--fail-fg); background: var(--fail-bg); }
  .issue { border-left: 3px solid var(--line); padding: 8px 10px; margin: 8px 0; background: var(--code); border-radius: 0 8px 8px 0; }
  .issue.error, .issue.fatal { border-left-color: var(--fail-fg); }
  .issue.warning { border-left-color: var(--warn-fg); }
  .issue.information { border-left-color: var(--accent); }
  .issue .meta { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); margin-bottom: 2px; }
  .issue .msg { font-size: 14px; }
  .sev { font-weight: 700; text-transform: uppercase; }
  .sev.error, .sev.fatal { color: var(--fail-fg); }
  .sev.warning { color: var(--warn-fg); }
  .sev.information { color: var(--accent); }
  .placeholder { color: var(--muted); }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>FHIR ePI Validator</h1>
  <span class="chip" id="identity">connecting...</span>

  <div class="grid">
    <div class="panel">
      <h2>Input</h2>
      <div class="row">
        <label for="epiType">ePI type</label>
        <select id="epiType">
          <option value="1">Type 1</option>
          <option value="2">Type 2</option>
          <option value="3">Type 3</option>
        </select>
        <label for="variant">Example</label>
        <select id="variant">
          <option value="correct">Correct</option>
          <option value="incorrect">Incorrect</option>
        </select>
        <button class="primary" id="validate">Validate</button>
        <label for="file" class="filebtn">Upload JSON</label>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
      <textarea id="body" spellcheck="false" placeholder="Paste a FHIR ePI Bundle (JSON) here, or use Upload JSON, then click Validate."></textarea>
    </div>

    <div class="panel">
      <h2>Result</h2>
      <div id="result"><p class="placeholder">Load a sample or paste a bundle, then Validate.</p></div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let seq = 0;  // guards against overlapping validations rendering out of order

  async function loadIdentity() {
    try {
      const r = await fetch('/api/v1/epi/info');
      const i = await r.json();
      $('identity').textContent =
        `HAPI ${i.hapiVersion} | FHIR ${i.fhirVersion} | ${i.igPackage} ${i.igVersion} | ${i.ready ? 'ready' : 'warming up'}`;
    } catch (e) { $('identity').textContent = 'validator unreachable'; }
  }

  async function loadExample() {
    const t = $('epiType').value, v = $('variant').value;
    try {
      const r = await fetch(`/samples/type${t}-${v}.json`);
      $('body').value = await r.text();
    } catch (e) {
      $('result').innerHTML = `<p class="placeholder">Could not load sample: ${esc(e.message)}</p>`; return;
    }
    validate();
  }

  function render(env) {
    const v = env.verdict || 'FAIL';
    const all = Array.isArray(env.issues) ? env.issues : [];
    const shown = all.filter(i => ['fatal', 'error', 'warning'].includes(i.severity));
    const errors = all.filter(i => i.severity === 'error' || i.severity === 'fatal').length;
    const warnings = all.filter(i => i.severity === 'warning').length;
    const notes = all.length - shown.length;   // information-level: summarised, not listed
    let html = `<div class="verdict ${esc(v)}">${esc(v)}`
      + `<small>requested ${esc(env.requestedEpiType)} | detected ${esc(env.detectedEpiType)}`
      + ` | effective ${esc(env.effectiveEpiType)} | ${errors} error(s), ${warnings} warning(s)`
      + `${notes ? ', ' + notes + ' note(s)' : ''}</small></div>`;
    if (!shown.length) {
      html += `<p class="placeholder">No errors or warnings.${notes ? ' ' + notes + ' informational note(s) not shown.' : ''}</p>`;
    } else {
      for (const i of shown) {
        const loc = [i.fhirPath, i.line ? 'line ' + i.line : ''].filter(Boolean).join(' | ');
        html += `<div class="issue ${esc(i.severity)}">`
          + `<div class="meta"><span class="sev ${esc(i.severity)}">${esc(i.severity)}</span>`
          + ` | ${esc(i.source || '')}${loc ? ' | ' + esc(loc) : ''}</div>`
          + `<div class="msg">${esc(i.message || '')}</div></div>`;
      }
      if (notes) html += `<p class="placeholder">+ ${notes} informational note(s) not shown.</p>`;
    }
    $('result').innerHTML = html;
  }

  async function validate() {
    const body = $('body').value.trim();
    if (!body) { $('result').innerHTML = '<p class="placeholder">Nothing to validate: paste a bundle or pick a sample.</p>'; return; }
    const my = ++seq;
    $('result').innerHTML = '<p class="placeholder">Validating...</p>';
    try {
      const r = await fetch('/api/v1/epi/validate?epiType=' + encodeURIComponent($('epiType').value), {
        method: 'POST', headers: { 'Content-Type': 'application/fhir+json' }, body
      });
      const text = await r.text();
      if (my !== seq) return;   // a newer validation has started; drop this stale result
      let env;
      try { env = JSON.parse(text); } catch (_) {
        $('result').innerHTML = `<p class="placeholder">HTTP ${r.status}: ${esc(text.slice(0, 400))}</p>`; return;
      }
      render(env);
    } catch (e) {
      if (my === seq) $('result').innerHTML = `<p class="placeholder">Request failed: ${esc(e.message)}</p>`;
    }
  }

  async function loadFile(ev) {
    const f = ev.target.files[0];
    if (!f) return;
    $('body').value = await f.text();
    ev.target.value = '';   // allow re-selecting the same file
    validate();
  }

  $('epiType').addEventListener('change', loadExample);
  $('variant').addEventListener('change', loadExample);
  $('validate').addEventListener('click', validate);
  $('file').addEventListener('change', loadFile);
  loadIdentity();
  loadExample();
</script>
</body>
</html>

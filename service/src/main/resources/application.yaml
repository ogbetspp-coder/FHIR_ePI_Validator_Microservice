server:
  port: 8080
  tomcat:
    threads:
      # Bound concurrent validations so load cannot exhaust the heap (the resident validator
      # is ~1 GB; excess requests queue in the connector instead of running in parallel).
      # Keep aligned with the platform's per-instance concurrency (e.g. Cloud Run --concurrency).
      max: 16

spring:
  application:
    name: epi-validator

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/{liveness,readiness}; readiness flips after warmup

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

epi:
  validation:
    # Env override names (relaxed binding, dashes dropped): EPI_VALIDATION_MAXBODYMB, ...
    max-body-mb: 50
    ig-package: packages/hl7.fhir.uv.emedicinal-product-info-1.0.0.tgz
    # NpmPackageValidationSupport does not resolve dependencies - list every declared dep:
    dependency-packages:
      - packages/hl7.terminology.r5-5.0.0.tgz
      - packages/hl7.fhir.uv.extensions.r5-1.0.0.tgz
    bundle-profile: http://hl7.org/fhir/uv/emedicinal-product-info/StructureDefinition/Bundle-uv-epi

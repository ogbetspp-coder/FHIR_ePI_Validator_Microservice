server:
  port: 8080
  # Drain in-flight validations on SIGTERM (Cloud Run / K8s recycling) instead of dropping them.
  shutdown: graceful
  tomcat:
    threads:
      # Concurrency is bounded by MEMORY, not CPU: the resident validator is large, so only a few
      # near-cap request bodies can be parsed and validated at once before the 2 GiB heap is
      # exhausted. Keep threads.max x max-body-mb within the heap headroom (4 x 8 MB is measured
      # safe). Align the platform per-instance concurrency (e.g. Cloud Run --concurrency) to this.
      max: 4

spring:
  application:
    name: epi-validator
  lifecycle:
    # Max wait for in-flight requests to finish during graceful shutdown (validations are <2s).
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/{liveness,readiness}; readiness flips after warmup

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

epi:
  validation:
    # Env override names (relaxed binding, dashes dropped): EPI_VALIDATION_MAXBODYMB, ...
    # max-body-mb x tomcat.threads.max bounds peak heap use; 8 MB x 4 threads is measured safe in a
    # 2 GiB container. Raising either needs more heap (see Dockerfile) or it can OOM under load.
    max-body-mb: 8
    # Reject bundles with more entries than this before validating, bounding per-request work (a
    # real ePI is far smaller; 1000 is generous).
    max-bundle-entries: 1000
    ig-package: packages/hl7.fhir.uv.emedicinal-product-info-1.0.0.tgz
    # NpmPackageValidationSupport does not resolve dependencies - list every declared dep:
    dependency-packages:
      - packages/hl7.terminology.r5-5.0.0.tgz
      - packages/hl7.fhir.uv.extensions.r5-1.0.0.tgz
    bundle-profile: http://hl7.org/fhir/uv/emedicinal-product-info/StructureDefinition/Bundle-uv-epi

server:
  # Cloud Run (and any PaaS) provides the serving port via $PORT; default 8080 locally and in Docker.
  port: ${PORT:8080}
  # Drain in-flight validations on SIGTERM (Cloud Run / K8s recycling) instead of dropping them.
  shutdown: graceful
  tomcat:
    threads:
      # Concurrency is bounded by MEMORY, not CPU. Keep threads.max x max-body-mb within the heap
      # headroom (4 x 8 MB is measured safe in 2 GiB); match the platform concurrency to this.
      max: 4

spring:
  application:
    name: epi-validator
  lifecycle:
    # Max wait for in-flight requests to finish during graceful shutdown (validations are <2s).
    timeout-per-shutdown-phase: 20s

management:
  # In the container Actuator runs on a separate port (Dockerfile: MANAGEMENT_SERVER_PORT=8081) so
  # request load on 8080 cannot starve health probes; left on the main port for local dev and tests.
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/{liveness,readiness}; readiness flips after warmup

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

epi:
  validation:
    # Env overrides use relaxed binding: EPI_VALIDATION_MAXBODYMB, EPI_VALIDATION_MAXBUNDLEENTRIES.
    # max-body-mb x threads.max bounds peak heap; 8 x 4 is measured safe in 2 GiB (raise both together).
    max-body-mb: 8
    # Reject bundles with more entries than this before validating, bounding per-request work (a
    # real ePI is far smaller; 1000 is generous).
    max-bundle-entries: 1000
    ig-package: packages/hl7.fhir.uv.emedicinal-product-info-1.0.0.tgz
    # NpmPackageValidationSupport does not resolve dependencies - list every declared dep:
    dependency-packages:
      - packages/hl7.terminology.r5-5.0.0.tgz
      - packages/hl7.fhir.uv.extensions.r5-1.0.0.tgz
    bundle-profile: http://hl7.org/fhir/uv/emedicinal-product-info/StructureDefinition/Bundle-uv-epi

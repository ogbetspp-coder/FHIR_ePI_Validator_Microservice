# Core product policy pack (Layer 4).
# The descriptor is the authority for severity/rationale; Java implementations
# (com.epi.validator.policy.rules.CorePolicyRules) only detect violations.
# Structural + semantic validity is enforced fail-fast at startup:
# unknown ruleIds, undeclared implementations, conflicting severities, or
# appliesTo entries that do not match configured IG ids all refuse to boot.
id: epi-gate-core
version: 0.1.0
appliesTo: ["1.0.0", "1.1.0"]
rules:
  - ruleId: EPI-DOC-001
    severity: error
    configurable: false
    rationale: "FHIR document bundles require a Composition as the first entry (FHIR documents specification)"
  - ruleId: EPI-DOC-002
    severity: error
    configurable: false
    rationale: "An ePI is a FHIR document; Bundle.type must be 'document'"
  - ruleId: EPI-DOC-003
    severity: error
    configurable: true
    rationale: "Label content lives in Composition sections; empty sections indicate extraction loss"
  - ruleId: EPI-DOC-004
    severity: error
    configurable: false
    rationale: "Every entry needs a fullUrl for in-document reference resolution"
  - ruleId: EPI-DOC-005
    severity: error
    configurable: false
    rationale: "Dangling references break document integrity and downstream rendering"
  - ruleId: EPI-DOC-006
    severity: error
    configurable: true
    rationale: "A persistent Bundle.identifier is required to track ePI versions across submissions"
  - ruleId: EPI-DOC-007
    severity: warning
    configurable: true
    rationale: "A coded Composition.type (e.g. SmPC vs PIL) enables downstream routing and display"
  - ruleId: EPI-TYPE-001
    severity: error
    configurable: false
    rationale: "Type 3 contract requires machine-readable clinical content; passing without it would hide extraction loss"
  - ruleId: EPI-TYPE-002
    severity: error
    configurable: false
    rationale: "Type 2/3 contract requires structured product data; passing without it would hide extraction loss"
  - ruleId: EPI-TYPE-003
    severity: warning
    configurable: true
    rationale: "Type 1 bundles carrying structured data suggest a mis-declared type upstream"

name: CI

# Runs on every push and pull request, and on manual dispatch. Not pinned to `main`: the
# repository's default branch is currently the working branch, so a `main`-only trigger would
# never fire. Build and tests should always produce a visible result.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: Service (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify committed IG packages against the SHA-256 lockfile (offline)
        run: tools/vendor-packages.sh --verify
      - name: Build and test
        run: mvn -B -f service/pom.xml verify
        env:
          MAVEN_OPTS: -Xmx2g
      - name: Generate CycloneDX SBOM
        run: mvn -B -f service/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: service/target/bom.*
          if-no-files-found: warn

  cross-check:
    name: Official HL7 validator cross-check
    runs-on: ubuntu-latest
    needs: [java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Runs the official org.hl7.fhir.validation ValidationEngine (version-matched to the
      # embedded engine) against the example bundles and asserts it reaches the same verdict as
      # the service. Downloads the FHIR R5 core package, so it is a separate, network-enabled job.
      - name: Cross-check verdicts against the official validator
        run: >
          mvn -B -f service/pom.xml -Dcrosscheck=true
          test-compile failsafe:integration-test failsafe:verify
          -Dit.test=OfficialValidatorCrossCheckIT
        env:
          MAVEN_OPTS: -Xmx1g

  docker-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    needs: [java]
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start service
        run: docker compose up -d --wait
      - name: Good bundle passes
        run: |
          verdict=$(curl -sS -X POST 'http://localhost:8080/api/v1/epi/validate?epiType=1' \
            -H 'Content-Type: application/fhir+json' \
            --data-binary @examples/good-bundle.json | jq -r .verdict)
          echo "verdict=$verdict"
          test "$verdict" = "PASS" -o "$verdict" = "PASS_WITH_WARNINGS"
      - name: Broken bundle fails with located issues
        run: |
          response=$(curl -sS -X POST 'http://localhost:8080/api/v1/epi/validate?epiType=1' \
            -H 'Content-Type: application/fhir+json' \
            --data-binary @examples/broken-bundle.json)
          echo "$response" | jq -e '.verdict == "FAIL"'
          echo "$response" | jq -e '[.issues[].ruleId] | index("EPI-DOC-003") != null'
      - name: Example script follows the verdict
        run: |
          python3 examples/validate_bundle.py examples/good-bundle.json --epi-type 1
          ! python3 examples/validate_bundle.py examples/broken-bundle.json --epi-type 1
      - name: Service logs on failure
        if: failure()
        run: docker compose logs epi-validator | tail -100
      - name: Teardown
        if: always()
        run: docker compose down -v

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epi-validator-client"
version = "0.1.0"
description = "Pipeline client for the FHIR ePI validation gate: validate_bundle(), gate(), and LLM-ready defect feedback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epi_validator_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["epi_validator_client"]

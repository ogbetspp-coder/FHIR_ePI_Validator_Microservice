# Cloud Build config: build the image from service/Dockerfile with the repo root as the
# build context, then push it to Artifact Registry. Building server-side means no local
# Docker and no push from your shell (the usual Cloud Shell failure point).
# Invoked by deploy/cloudrun.sh:
#   gcloud builds submit . --config deploy/cloudbuild.yaml --substitutions _IMAGE=<image>
steps:
  - name: gcr.io/cloud-builders/docker
    # DOCKER_BUILDKIT=0 forces the classic builder, which produces a single linux/amd64
    # image manifest. With BuildKit on, the build attaches provenance/attestation manifests
    # and pushes an OCI image index; Cloud Run cannot start such an image and fails with
    # "container failed to start and listen on PORT" and no application logs.
    env: ["DOCKER_BUILDKIT=0"]
    args: ["build", "-t", "${_IMAGE}", "-f", "service/Dockerfile", "."]
images: ["${_IMAGE}"]
options:
  # Newer projects run builds as the Compute Engine default service account, which requires
  # the build to name a log destination. Send logs to Cloud Logging (no GCS log bucket needed).
  logging: CLOUD_LOGGING_ONLY
